<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="¿Es buen momento para correr o hacer senderismo? Recomendación basada en la previsión horaria." />
    <meta name="theme-color" content="#f5f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint, so a forced theme never flashes.
      // Mirrors src/ui/theme.ts; the storage format lives in src/data/storage.ts.
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem('outdoor-window:v1') || '{}').theme;
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            var color = theme === 'dark' ? '#0f1412' : '#f5f7f6';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) {
              el.setAttribute('content', color);
            });
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a55'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23ffd34d'/%3E%3Cpath d='M4 26l8-8 5 5 4-3 7 6z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Outdoor Window</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
